# HashCode Meet: the translations are loaded as lang/main-<lang>.json, with no
# version in the URL, and 20-hashcode-branding rewrites them at start (the
# name, the tagline). Without this, browsers keep an old copy (« Jitsi Meet »)
# for days. Revalidated on each load instead: a 304 when unchanged.
# Included in the server block (/config/nginx-custom/*.conf in meet.conf);
# takes /lang/ over from Jitsi's static rule, so its CORS header is repeated.
location ^~ /lang/ {
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header Cache-Control "no-cache" always;
}
location = /manifest.json {
    add_header Cache-Control "no-cache" always;
}
