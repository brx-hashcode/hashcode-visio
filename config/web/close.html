<!doctype html>
<!--
  HashCode Meet: the page after leaving a call. Mounted over Jitsi's
  static/close.html and static/close2.html: with config.enableClosePage, Jitsi
  comes here as soon as it has left the room (~0.3 s), instead of showing
  « Merci d'avoir utilisé… » for 3 s before going back to the welcome page.
-->
<html lang="fr">
<head>
  <!--#include virtual="/base.html" -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Réunion terminée · HashCode Meet</title>
  <link rel="icon" type="image/png" href="/images/hashcode-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 60% 55% at 50% 0%, rgba(255, 106, 0, 0.16), transparent 70%),
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 100% 100%, 60px 60px, 60px 60px;
      -webkit-mask-image: linear-gradient(to bottom, #000 50%, transparent);
      mask-image: linear-gradient(to bottom, #000 50%, transparent);
      pointer-events: none;
    }
    header, main { position: relative; }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 752px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 16px 0;
      font-weight: 700;
      color: inherit;
      text-decoration: none;
    }
    header img { width: 44px; height: 44px; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px 96px;
    }
    .eyebrow {
      color: #ff6a00;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }
    p {
      color: rgba(245, 245, 245, 0.6);
      font-size: 1.0625rem;
      line-height: 1.6;
      margin: 16px 0 36px;
      max-width: 440px;
    }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      padding: 0 28px;
      border-radius: 2px;
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .btn-primary { background: #ff6a00; color: #fff; }
    .btn-primary:hover { background: #e65f00; }
    .btn-ghost { border: 1px solid rgba(255, 255, 255, 0.2); color: #f5f5f5; }
    .btn-ghost:hover { border-color: rgba(255, 255, 255, 0.4); }
    .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) {
      .actions { flex-direction: column; width: 100%; max-width: 320px; }
    }
  </style>
</head>
<body>
  <a href="/" aria-label="HashCode Meet, accueil" style="color: inherit; text-decoration: none;">
    <header><img src="/images/hashcode-logo.png" alt="">HashCode Meet</header>
  </a>
  <main>
    <div class="eyebrow">Réunion terminée</div>
    <h1>Vous avez quitté la réunion</h1>
    <p>Merci d'avoir utilisé HashCode Meet.</p>
    <div class="actions">
      <a class="btn btn-ghost" id="rejoin" href="/" hidden>Rejoindre la réunion</a>
      <a class="btn btn-primary" href="/">Nouvelle réunion</a>
    </div>
  </main>
  <script>
    // Jitsi navigates here from the room, so the referrer is the room's URL:
    // offer to rejoin it (same server only, never the welcome page itself).
    (function () {
      try {
        var r = document.referrer && new URL(document.referrer);
        if (!r || r.origin !== location.origin) return;
        var room = r.pathname.replace(/^\/+|\/+$/g, '');
        if (!room || room.indexOf('static') === 0 || room.indexOf('/') !== -1) return;
        var a = document.getElementById('rejoin');
        a.href = '/' + room;
        a.hidden = false;
      } catch (e) { /* no referrer: « Nouvelle réunion » only */ }
    })();
  </script>
</body>
</html>
