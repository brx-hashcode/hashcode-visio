name: Deploy Visio

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The call's address; a repository variable overrides it.
  VISIO_DOMAIN: ${{ vars.VISIO_DOMAIN || 'visio.hashcode.digital' }}
  # Vosk is the one image we build. Like rabotka-backend: built once here,
  # pushed to GHCR with a registry build cache, and the server only pulls.
  VOSK_IMAGE: ghcr.io/${{ github.repository_owner }}/hashcode-visio-vosk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-visio
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Compose file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate with dummy values
        run: |
          cat > .env <<EOF
          VISIO_DOMAIN=${VISIO_DOMAIN}
          VISIO_PUBLIC_IP=203.0.113.10
          JWT_APP_ID=rabotka
          JWT_APP_SECRET=ci
          JICOFO_AUTH_PASSWORD=ci
          JVB_AUTH_PASSWORD=ci
          JIGASI_TRANSCRIBER_PASSWORD=ci
          TURN_SECRET=ci
          EOF
          docker compose config --quiet

      - name: Check the scripts
        run: bash -n scripts/setup.sh && bash -n scripts/firewall.sh

  build-vosk:
    name: Build Vosk image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Tag from vosk/
        # Tagged by the content of vosk/, so an unchanged Dockerfile maps to an
        # image that already exists and nothing is built or pulled again.
        id: tag
        run: |
          h=$(find vosk -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          echo "image=${VOSK_IMAGE}:small-fr-0.22-$h" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already built?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"; echo "Already in GHCR: skipping the build."
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.exists.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: vosk
          push: true
          tags: ${{ steps.tag.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.VOSK_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.VOSK_IMAGE }}:buildcache,mode=max,ignore-error=true

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [validate, build-vosk]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Check the GitHub secrets
        # GitHub holds only how to reach the server and Vault; everything the
        # stack runs with comes from Vault (secret/apps/hashcode-visio).
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          missing=0
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VAULT_ADDR VAULT_ROLE_ID VAULT_SECRET_ID; do
            if [ -z "${!v}" ]; then echo "FATAL: GitHub secret $v is empty or missing"; missing=1; fi
          done
          exit $missing

      - name: Fetch secrets from Vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf --request POST \
            --data "{\"role_id\":\"$VAULT_ROLE_ID\",\"secret_id\":\"$VAULT_SECRET_ID\"}" \
            "$VAULT_ADDR/v1/auth/approle/login" | jq -r '.auth.client_token // empty') || true
          if [ -z "${TOKEN:-}" ]; then
            echo "FATAL: Vault login failed (VAULT_ADDR, VAULT_ROLE_ID or VAULT_SECRET_ID)"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          SECRET=$(curl -sf --header "X-Vault-Token: $TOKEN" \
            "$VAULT_ADDR/v1/secret/data/apps/hashcode-visio" | jq -c '.data.data // empty') || true
          if [ -z "${SECRET:-}" ]; then
            echo "FATAL: could not read secret/apps/hashcode-visio (missing, or not in the role's policy)"
            exit 1
          fi

          get() { echo "$SECRET" | jq -r --arg k "$1" '.[$k] // empty'; }
          # Required: an empty one would start a server with no auth or no TURN
          # secret, which is worse than a failed deploy.
          missing=0
          for k in VISIO_PUBLIC_IP JWT_APP_SECRET JICOFO_AUTH_PASSWORD JVB_AUTH_PASSWORD JIGASI_TRANSCRIBER_PASSWORD TURN_SECRET; do
            if [ -z "$(get "$k")" ]; then echo "FATAL: Vault key $k is empty or missing"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

          # Never shown in the logs, whatever prints them later.
          for k in JWT_APP_SECRET JICOFO_AUTH_PASSWORD JVB_AUTH_PASSWORD JIGASI_TRANSCRIBER_PASSWORD TURN_SECRET; do
            echo "::add-mask::$(get "$k")"
          done

          DOMAIN=$(get VISIO_DOMAIN); DOMAIN=${DOMAIN:-$VISIO_DOMAIN}
          APP_ID=$(get JWT_APP_ID); APP_ID=${APP_ID:-rabotka}
          umask 077
          {
            echo "VISIO_DOMAIN=$DOMAIN"
            echo "VISIO_PUBLIC_IP=$(get VISIO_PUBLIC_IP)"
            echo "JWT_APP_ID=$APP_ID"
            echo "VOSK_IMAGE=${{ needs.build-vosk.outputs.image }}"
            for k in JWT_APP_SECRET JICOFO_AUTH_PASSWORD JVB_AUTH_PASSWORD JIGASI_TRANSCRIBER_PASSWORD TURN_SECRET; do
              echo "$k=$(get "$k")"
            done
          } > "$RUNNER_TEMP/visio.env"

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy the stack
        # Only what the server runs: no git checkout on the box, so nothing
        # there can drift or conflict. .env is never copied (it is written below).
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy -p $VPS_PORT"
          $SSH "$VPS_USER@$VPS_HOST" 'mkdir -p ~/hashcode-visio'
          rsync -az --delete --exclude .env -e "$SSH" \
            docker-compose.yml .env.example config scripts vosk \
            "$VPS_USER@$VPS_HOST:hashcode-visio/"

      - name: Write .env and start
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR login for this pull only, with the run token (valid for the
          # job, read-only on packages), then logged out again.
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null"
          ssh -i ~/.ssh/deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -e
            cd ~/hashcode-visio
            umask 077
            cat > .env
            # The Traefik of Dokploy serves the call page: its network must exist.
            if ! docker network inspect dokploy-network >/dev/null 2>&1; then
              echo "FATAL: dokploy-network is missing: Dokploy and its Traefik must run on this box."
              exit 1
            fi
            # Only changed layers download; nothing is built on the server.
            pull_ok=0; docker compose pull --quiet && pull_ok=1
            docker logout ghcr.io >/dev/null
            [ "$pull_ok" = 1 ] || { echo "FATAL: docker compose pull failed"; exit 1; }
            docker compose up -d --no-build --remove-orphans
            docker image prune -f >/dev/null
            docker compose ps
          ' < "$RUNNER_TEMP/visio.env"
          rm -f "$RUNNER_TEMP/visio.env"

  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Wait for the stack
        run: sleep 30

      - name: The page answers over HTTPS
        run: curl -sf --max-time 15 "https://${VISIO_DOMAIN}/" > /dev/null

      - name: Rabotka's embed script is served
        run: curl -sf --max-time 15 "https://${VISIO_DOMAIN}/external_api.js" | grep -q JitsiMeetExternalAPI

      - name: Tokens are checked, and rooms open without one
        # Open to anyone (JWT_ALLOW_EMPTY), but a token is still verified when
        # an app sends one: the JWT domain stays, with no anonymous domain.
        run: |
          curl -sf --max-time 15 "https://${VISIO_DOMAIN}/config.js" > config.js
          grep -q "config.hosts.domain" config.js
          if grep -q "anonymousdomain" config.js; then
            echo "FATAL: JWT auth is off: app tokens (moderator, captions) are ignored"
            exit 1
          fi

      - name: HashCode Meet replaces « Jitsi Meet »
        run: |
          curl -sf --max-time 15 "https://${VISIO_DOMAIN}/interface_config.js" | grep -q "APP_NAME = 'HashCode Meet'"
          curl -sf --max-time 15 "https://${VISIO_DOMAIN}/" > index.html
          grep -q "<title>HashCode Meet" index.html
          grep -q 'property="og:image" content="https://visio.hashcode.digital/images/og-image.png"' index.html
          curl -sf --max-time 15 -o /dev/null "https://${VISIO_DOMAIN}/images/og-image.png"
          curl -sf --max-time 15 "https://${VISIO_DOMAIN}/robots.txt" | grep -q "^Sitemap: "
          curl -sf --max-time 15 "https://${VISIO_DOMAIN}/sitemap.xml" | grep -q "<loc>"
          curl -sf --max-time 15 -o /dev/null "https://${VISIO_DOMAIN}/images/hashcode-logo.png"
          curl -sf --max-time 15 "https://${VISIO_DOMAIN}/lang/main-fr.json" | grep -q '"headerTitle": "HashCode Meet"'
          # English is compiled into the bundle: patched, under its own ?v=.
          grep -q 'app.bundle.min.js?v=[0-9]*hc[0-9]*"' index.html
          # The page after « Quitter » (config.enableClosePage).
          curl -sf --max-time 15 "https://${VISIO_DOMAIN}/static/close2.html" | grep -q "Vous avez quitté la réunion"

      - name: Slack notify success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": "Visio deploy succeeded\nBranch: `${{ github.ref_name }}`\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }

      - name: Slack notify failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": "Visio deploy FAILED\nBranch: `${{ github.ref_name }}`\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
