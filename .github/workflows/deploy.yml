name: Deploy Visio

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The call's address; a repository variable overrides it.
  VISIO_DOMAIN: ${{ vars.VISIO_DOMAIN || 'visio.hashcode.digital' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-visio
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Compose file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate with dummy values
        run: |
          cat > .env <<EOF
          VISIO_DOMAIN=${VISIO_DOMAIN}
          VISIO_PUBLIC_IP=203.0.113.10
          JWT_APP_ID=rabotka
          JWT_APP_SECRET=ci
          JICOFO_AUTH_PASSWORD=ci
          JVB_AUTH_PASSWORD=ci
          TURN_SECRET=ci
          EOF
          docker compose config --quiet

      - name: Check the scripts
        run: bash -n scripts/setup.sh && bash -n scripts/firewall.sh

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Check the secrets
        # An empty secret reaches the VPS as an empty string, silently; a room
        # signed with an empty secret, or a TURN relay with no secret, is worse
        # than a failed deploy.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VISIO_PUBLIC_IP: ${{ secrets.VISIO_PUBLIC_IP }}
          JWT_APP_SECRET: ${{ secrets.JWT_APP_SECRET }}
          JICOFO_AUTH_PASSWORD: ${{ secrets.JICOFO_AUTH_PASSWORD }}
          JVB_AUTH_PASSWORD: ${{ secrets.JVB_AUTH_PASSWORD }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
        run: |
          missing=0
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VISIO_PUBLIC_IP JWT_APP_SECRET JICOFO_AUTH_PASSWORD JVB_AUTH_PASSWORD TURN_SECRET; do
            if [ -z "${!v}" ]; then echo "FATAL: secret $v is empty or missing"; missing=1; fi
          done
          exit $missing

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy the stack
        # Only what the server runs: no git checkout on the box, so nothing
        # there can drift or conflict. .env is never copied (it is written below).
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy -p $VPS_PORT"
          $SSH "$VPS_USER@$VPS_HOST" 'mkdir -p ~/hashcode-visio'
          rsync -az --delete --exclude .env -e "$SSH" \
            docker-compose.yml .env.example config scripts \
            "$VPS_USER@$VPS_HOST:hashcode-visio/"

      - name: Write .env and start
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VISIO_PUBLIC_IP: ${{ secrets.VISIO_PUBLIC_IP }}
          JWT_APP_SECRET: ${{ secrets.JWT_APP_SECRET }}
          JICOFO_AUTH_PASSWORD: ${{ secrets.JICOFO_AUTH_PASSWORD }}
          JVB_AUTH_PASSWORD: ${{ secrets.JVB_AUTH_PASSWORD }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
        run: |
          {
            echo "VISIO_DOMAIN=${VISIO_DOMAIN}"
            echo "VISIO_PUBLIC_IP=${VISIO_PUBLIC_IP}"
            echo "JWT_APP_ID=rabotka"
            echo "JWT_APP_SECRET=${JWT_APP_SECRET}"
            echo "JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}"
            echo "JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}"
            echo "TURN_SECRET=${TURN_SECRET}"
          } | ssh -i ~/.ssh/deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -e
            cd ~/hashcode-visio
            umask 077
            cat > .env
            if ! docker network inspect hashcode-public >/dev/null 2>&1; then
              echo "FATAL: hashcode-public is missing: hashcode-vps-infra must run on this box first."
              exit 1
            fi
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker compose ps
          '

  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Wait for the stack
        run: sleep 30

      - name: The page answers over HTTPS
        run: curl -sf --max-time 15 "https://${VISIO_DOMAIN}/" > /dev/null

      - name: Rabotka's embed script is served
        run: curl -sf --max-time 15 "https://${VISIO_DOMAIN}/external_api.js" | grep -q JitsiMeetExternalAPI

      - name: Rooms need a token (JWT auth on)
        # With JWT on there is no anonymous domain: nobody opens a room without
        # a token from Rabotka's API.
        run: |
          curl -sf --max-time 15 "https://${VISIO_DOMAIN}/config.js" > config.js
          grep -q "config.hosts.domain" config.js
          if grep -q "anonymousdomain" config.js; then
            echo "FATAL: anonymous rooms are open (JWT auth is off)"
            exit 1
          fi

      - name: The HashCode logo replaces « jitsi »
        run: curl -sf --max-time 15 "https://${VISIO_DOMAIN}/interface_config.js" | grep -q "DEFAULT_LOGO_URL = 'https://avatars.githubusercontent.com"

      - name: Slack notify success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": "Visio deploy succeeded\nBranch: `${{ github.ref_name }}`\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }

      - name: Slack notify failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": "Visio deploy FAILED\nBranch: `${{ github.ref_name }}`\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
